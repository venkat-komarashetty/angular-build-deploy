name: Frontend Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js version v26.7.0
        uses: actions/setup-node@v3
        with:
          node-version: '26.7.0'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Run linting
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build