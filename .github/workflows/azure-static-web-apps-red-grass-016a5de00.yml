name: Frontend Build and Deploy to Azure Static Web App
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js version v26.7.0
        uses: actions/setup-node@v3
        with:
          node-version: '26.7.0'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Run linting
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/angular-build-deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/angular-build-deploy

      - name: Check if token is populated
        run: |
          if [ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]; then
            echo "❌ The token is EMPTY! GitHub is not passing the secret to the runner."
            exit 1
          else
            echo "✅ The token is present."
          fi

      - name: Verify Artifact Structure
        run: |
          echo "Checking contents of dist/angular-build-deploy/browser:"
          ls -la dist/angular-build-deploy/browser || echo "Directory does not exist!"

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/angular-build-deploy/browser
          output_location: ""
          skip_app_build: true
